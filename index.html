<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>モニター写真作成</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>モニター写真作成</h1>

  <div class="stage"><canvas id="canvas"></canvas></div>
  <p class="hint">＋をタップして写真を選択／写真をタップすると拡大縮小・位置調整<br>書き出しサイズ：3840×2160px（背景は黒で書き出されます）</p>

  <section class="panel">
    <label>余白 <output id="gapOut"></output>
      <input id="gap" type="range" min="0" max="80" value="16">
    </label>

    <div class="switch">
      <span>目元ぼかし（左右の目に丸いぼかし）</span>
      <input id="blurOn" type="checkbox">
    </div>
    <label id="blurSizeWrap" hidden>ぼかしの大きさ <output id="blurSizeOut"></output>
      <input id="blurSize" type="range" min="50" max="250" value="120">
    </label>
    <p id="status" class="status"></p>

    <div class="row">
      <button id="clear">クリア</button>
      <button id="save" class="primary">画像を保存</button>
    </div>
  </section>
</main>

<input id="one" type="file" accept="image/*" hidden>

<!-- 拡大縮小・位置調整 -->
<div id="editor" class="modal" hidden>
  <div class="modal-box">
    <p class="hint">ドラッグで位置、ピンチ／スライダーで拡大縮小</p>
    <canvas id="edCanvas"></canvas>
    <label>拡大 <output id="zoomOut"></output>
      <input id="zoom" type="range" min="100" max="500" value="100">
    </label>
    <div class="row">
      <button id="edCancel">キャンセル</button>
      <button id="edChange">画像を変更</button>
      <button id="edSave" class="primary">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
