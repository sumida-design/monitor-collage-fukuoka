<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>モニター写真作成</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main>
  <h1>モニター写真作成</h1>

  <div class="stage"><canvas id="canvas"></canvas></div>
  <p class="hint" id="hint"></p>

  <section class="panel">
    <div class="switch">
      <span>目元ぼかし（目の部分に丸いぼかし）</span>
      <input id="blurOn" type="checkbox">
    </div>
    <label id="blurSizeWrap" hidden>ぼかしの大きさ <output id="blurSizeOut"></output>
      <input id="blurSize" type="range" min="50" max="250" value="100">
    </label>
    <div id="status" class="status"></div>

    <div class="row">
      <button id="clear">クリア</button>
      <button id="save" class="primary">画像を保存</button>
    </div>
  </section>
  <p id="ver" class="ver"></p>
</main>

<input id="one" type="file" accept="image/*" hidden>

<!-- 拡大縮小・位置調整 -->
<div id="editor" class="modal" hidden>
  <div class="modal-box">
    <p class="hint">ドラッグで位置、ピンチ／スライダーで拡大縮小</p>
    <canvas id="edCanvas"></canvas>
    <label>拡大 <output id="zoomOut"></output>
      <input id="zoom" type="range" min="100" max="500" value="100">
    </label>
    <div class="row">
      <button id="edCancel">キャンセル</button>
      <button id="edChange">画像を変更</button>
      <button id="edSave" class="primary">保存</button>
    </div>
  </div>
</div>

<!-- 手動ぼかし -->
<div id="manual" class="modal" hidden>
  <div class="modal-box">
    <p class="hint">目の位置をタップするとぼかしの丸が置かれます。ドラッグで移動できます。</p>
    <canvas id="mCanvas"></canvas>
    <label>選択中の丸の大きさ
      <input id="mSize" type="range" min="10" max="200" value="60">
    </label>
    <div class="row">
      <button id="mDelete">選択した丸を削除</button>
      <button id="mCancel">キャンセル</button>
      <button id="mDone" class="primary">完了</button>
    </div>
  </div>
</div>

<script src="app.js?v=4"></script>
</body>
</html>
